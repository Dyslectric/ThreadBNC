<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
<title id="t">Diving into articles</title>
<desc id="d">A saved article opens in a clean reading view. A link inside it to another article opens beside it, and that article lists the articles that mention it.</desc>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#66666b;--line:#e3e1dc;--accent:#2f5fb3;--kept:#a66a00;--kept-bg:#fbf0da;--new-bg:#e5edfb;--bar:#ebe9e4;--shade:rgba(20,20,30,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1e1e21;--text:#e8e8ea;--muted:#9d9da5;--line:#2f2f34;--accent:#8fb1ff;--kept:#f0c26b;--kept-bg:#3a2f17;--new-bg:#1f2a44;--bar:#2a2a2f;--shade:rgba(0,0,0,.45)}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line)}.shade{fill:var(--shade)}.bar{fill:var(--bar)}
.m{fill:var(--muted)}.a{fill:var(--accent)}.k{fill:var(--kept)}
.xs{font-size:11px}.s{font-size:12.5px}.b{font-weight:650}
.h1{font-size:21px;font-weight:720;letter-spacing:-.01em}.h2{font-size:16px;font-weight:700}
.pill{fill:none;stroke:var(--line)}.pill-k{fill:var(--kept-bg);stroke:none}.hl{fill:var(--new-bg)}
.u{text-decoration:underline}.ln{stroke:var(--line)}
.arrow{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}.ah{fill:var(--accent)}
.ico{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect class="bg" width="880" height="460" rx="16"/>

<!-- the reader -->
<rect class="card" x="24.5" y="24.5" width="500" height="411" rx="12"/>
<text x="46" y="54" class="s a">← Back to the post in c/opendata</text>
<text x="46" y="84" class="xs m">news.example · 21 Sept 2026</text>
<text x="46" y="112" class="h1">City council votes to open-source</text>
<text x="46" y="138" class="h1">its transit data</text>
<text x="46" y="162" class="s m">By Jordan Reyes</text>
<text x="46" y="182" class="xs m">1,240 words · about 6 min · saved 2 hours ago</text>
<rect class="pill-k" x="46" y="194" width="70" height="26" rx="13"/>
<text x="59" y="211" class="s b k">★ Kept</text>
<rect class="pill" x="124.5" y="194.5" width="96" height="25" rx="12.5"/>
<text x="140" y="211" class="s">Comments</text>
<rect class="pill" x="228.5" y="194.5" width="84" height="25" rx="12.5"/>
<text x="244" y="211" class="s">Original</text>

<rect class="bar" x="46" y="240" width="456" height="8" rx="4"/>
<rect class="bar" x="46" y="258" width="430" height="8" rx="4"/>
<rect class="bar" x="46" y="276" width="448" height="8" rx="4"/>
<rect class="hl" x="158" y="290" width="190" height="22" rx="5"/>
<text x="46" y="306" class="s m" textLength="277" lengthAdjust="spacingAndGlyphs">the dataset follows a <tspan class="a u">report from Open Transit Lab</tspan></text>
<g class="ico" transform="translate(328 293.5) scale(.62)"><path d="M5 3.5h14v17H5ZM8.5 8h7M8.5 12h7M8.5 16h4"/></g>
<rect class="bar" x="46" y="322" width="410" height="8" rx="4"/>
<rect class="bar" x="46" y="340" width="300" height="8" rx="4"/>

<line class="ln" x1="46" y1="364.5" x2="502" y2="364.5"/>
<text x="46" y="388" class="s b">Also posted in</text>
<text x="46" y="410" class="s a">Council opens transit feeds <tspan class="m">· c/transit@forum.example</tspan></text>

<!-- the dive -->
<path class="arrow" d="M350 301 C 450 301, 500 210, 552 190"/>
<path class="ah" d="M556 188 l-11 -2 l5 9 z"/>

<rect class="shade" x="552" y="70" width="306" height="370" rx="12"/>
<rect class="card" x="548.5" y="62.5" width="306" height="368" rx="12"/>
<text x="570" y="92" class="s a">× Close · Open on its own</text>
<text x="570" y="122" class="xs m">opentransitlab.example · 3 Sept 2026</text>
<text x="570" y="148" class="h2">Why transit data should</text>
<text x="570" y="170" class="h2">belong to the public</text>
<text x="570" y="192" class="xs m">860 words · about 4 min · saved just now</text>
<rect class="bar" x="570" y="212" width="262" height="8" rx="4"/>
<rect class="bar" x="570" y="230" width="244" height="8" rx="4"/>
<rect class="bar" x="570" y="248" width="258" height="8" rx="4"/>
<rect class="bar" x="570" y="266" width="190" height="8" rx="4"/>
<rect class="bar" x="570" y="284" width="250" height="8" rx="4"/>

<line class="ln" x1="570" y1="310.5" x2="832" y2="310.5"/>
<text x="570" y="334" class="s b">Mentioned in</text>
<text x="570" y="358" class="s a">City council votes to open-source…</text>
<text x="570" y="376" class="xs m">news.example</text>
<text x="570" y="400" class="s a">Buses, bytes and the right to know</text>
<text x="570" y="418" class="xs m">civicwire.example</text>
</svg>
