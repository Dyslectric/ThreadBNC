<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
<title id="t">Keep what matters</title>
<desc id="d">Posts from followed communities expire after the retention period. Starring one keeps it with no expiry, and the Kept page gathers kept threads, videos, audio and articles.</desc>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#66666b;--line:#e3e1dc;--accent:#2f5fb3;--on-accent:#fff;--kept:#a66a00;--kept-bg:#fbf0da;--hover:#efede8;--bar:#ebe9e4;--th1:#c9d8f5;--th2:#e8d3b0;--th3:#cfe6d6}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1e1e21;--text:#e8e8ea;--muted:#9d9da5;--line:#2f2f34;--accent:#8fb1ff;--on-accent:#0e1422;--kept:#f0c26b;--kept-bg:#3a2f17;--hover:#26262a;--bar:#2a2a2f;--th1:#2d3d5c;--th2:#4a3b24;--th3:#264232}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line)}.card-k{fill:var(--card);stroke:var(--kept);stroke-width:1.5}
.ghost{fill:none;stroke:var(--muted);stroke-dasharray:5 5;stroke-opacity:.6}
.m{fill:var(--muted)}.a{fill:var(--accent)}.k{fill:var(--kept)}.oa{fill:var(--on-accent)}
.xs{font-size:11px}.s{font-size:12.5px}.b{font-weight:650}.t{font-size:14.5px;font-weight:680}.h{font-size:20px;font-weight:720}
.pill{fill:none;stroke:var(--line)}.pill-k{fill:var(--kept-bg)}.bar{fill:var(--bar)}
.input{fill:var(--bg);stroke:var(--line)}.btn{fill:var(--accent)}
.tab-on{fill:var(--hover)}.cnt{fill:var(--hover)}.ln{stroke:var(--line)}
.th1{fill:var(--th1)}.th2{fill:var(--th2)}.th3{fill:var(--th3)}
.arrow{fill:none;stroke:var(--kept);stroke-width:2;stroke-dasharray:5 4}.ah{fill:var(--kept)}
</style>
<rect class="bg" width="880" height="460" rx="16"/>

<!-- the feed -->
<text x="28" y="44" class="s b m">Feed</text>

<rect class="card" x="24.5" y="58.5" width="400" height="106" rx="12"/>
<rect class="th1" x="40" y="74" width="64" height="64" rx="8"/>
<text x="118" y="86" class="xs m">c/homelab · 2d · 96 comments</text>
<text x="118" y="108" class="t">A plain-language tour of the new</text>
<text x="118" y="126" class="t">kernel's scheduler</text>
<rect class="pill" x="118.5" y="136.5" width="68" height="21" rx="10.5"/>
<text x="130" y="151" class="xs">☆ Keep</text>
<text x="196" y="151" class="xs m">expires in 12 days</text>

<rect class="card-k" x="24.5" y="180.5" width="400" height="106" rx="12"/>
<rect class="th2" x="40" y="196" width="64" height="64" rx="8"/>
<text x="118" y="208" class="xs m">c/selfhosted · 5d · 211 comments</text>
<text x="118" y="230" class="t">The snapshot guide I wish I'd</text>
<text x="118" y="248" class="t">read before my first outage</text>
<rect class="pill-k" x="118" y="258" width="68" height="21" rx="10.5"/>
<text x="129" y="273" class="xs b k">★ Kept</text>
<text x="196" y="273" class="xs k">no expiry, stays until you unkeep it</text>

<rect class="ghost" x="24.5" y="302.5" width="400" height="84" rx="12"/>
<rect class="bar" x="40" y="318" width="52" height="52" rx="8"/>
<rect class="bar" x="106" y="324" width="220" height="9" rx="4.5"/>
<rect class="bar" x="106" y="342" width="160" height="9" rx="4.5"/>
<text x="106" y="366" class="xs m">past its retention period: removed</text>
<text x="28" y="414" class="xs m">Retention is set per community. Only posts you haven't kept expire.</text>

<path class="arrow" d="M428 232 C 452 232, 452 188, 476 172"/>
<path class="ah" d="M480 169 l-11 1 l6 8z"/>

<!-- the Kept page -->
<rect class="card" x="476.5" y="24.5" width="380" height="411" rx="12"/>
<text x="498" y="60" class="h"><tspan class="k">★</tspan> Kept</text>
<rect class="input" x="498.5" y="76.5" width="258" height="31" rx="8"/>
<text x="512" y="96" class="s m">Paste a post's link to keep it…</text>
<rect class="btn" x="764" y="76" width="72" height="32" rx="8"/>
<text x="784" y="97" class="s b oa">Keep</text>

<rect class="tab-on" x="498" y="122" width="84" height="26" rx="8"/>
<text x="508" y="139" class="s b">Threads</text>
<rect class="cnt" x="558" y="128" width="18" height="14" rx="7"/><text x="563" y="139" class="xs m">7</text>
<text x="594" y="139" class="s m">Videos</text>
<rect class="cnt" x="636" y="128" width="18" height="14" rx="7"/><text x="641" y="139" class="xs m">2</text>
<text x="666" y="139" class="s m">Articles</text>
<rect class="cnt" x="717" y="128" width="18" height="14" rx="7"/><text x="722" y="139" class="xs m">4</text>
<text x="748" y="139" class="s m">Changed</text>
<line class="ln" x1="498" y1="160.5" x2="836" y2="160.5"/>

<text x="498" y="186" class="xs b m">C/SELFHOSTED</text>
<rect class="th2" x="498" y="196" width="36" height="36" rx="6"/>
<text x="546" y="210" class="s">The snapshot guide I wish I'd read…</text>
<text x="546" y="226" class="xs m">kept just now · 211 comments</text>
<rect class="th3" x="498" y="242" width="36" height="36" rx="6"/>
<text x="546" y="256" class="s">Two backup tools, two years later</text>
<text x="546" y="272" class="xs m">kept 3 weeks ago · 88 comments · 1 edit</text>

<text x="498" y="310" class="xs b m">C/OPENDATA</text>
<rect class="th1" x="498" y="320" width="36" height="36" rx="6"/>
<text x="546" y="334" class="s">City council votes to open-source its…</text>
<text x="546" y="350" class="xs m">kept 2 months ago · article saved</text>
<rect class="bar" x="498" y="370" width="36" height="36" rx="6"/>
<text x="546" y="384" class="s">A post kept by its link, no following needed</text>
<text x="546" y="400" class="xs m">kept 4 months ago · from a pasted link</text>
</svg>
