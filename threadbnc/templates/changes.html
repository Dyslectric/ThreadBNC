{% extends "base.html" %}
{% from "_macros.html" import change_row %}
{% block title %}Changes{% endblock %}
{% block content %}
<h1>Observed changes</h1>
<section class="card">
  {% if not changes %}<p class="muted">No changes observed yet.</p>{% endif %}
  <ul class="plain">{% for ch in changes %}{{ change_row(ch) }}{% endfor %}</ul>
</section>
{% endblock %}
